name: openwa-prod

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - POST=1
    networks:
      - openwa-prod
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwa:prod
    ports:
      - "2785:2785"
    environment:
      - DEBUG=false
      - DOCKER_SOCKET_PATH=/tmp/docker.sock
      - DOCKER_MTU=1500
    env_file:
      - .env
    mem_limit: 2g
    volumes:
      - openwa_prod_openwa-data:/app/data
      - /tmp/docker.sock:/tmp/docker.sock
    networks:
      - openwa-prod
    depends_on:
      - docker-proxy
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  openwa_prod_openwa-data:

networks:
  openwa-prod:
    driver: bridge
